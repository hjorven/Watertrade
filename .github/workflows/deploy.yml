name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Publishable Key ist öffentlich (Schutz über Zeilensicherheit), daher als Standardwert hier.
          # Repo-Variablen SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY überschreiben ihn, falls gesetzt.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://qkcvqzzaxmoktaqsiujv.supabase.co' }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_GGtXWtbiTHxS2ussD2egxw_RvzhgPfO' }}
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
